<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BI Dashboard - Premium Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            /* Palet Warna Sesuai Dashboard */
            --bg-primary: #741415;
            --bg-secondary: #961917;
            --bg-dark-vignette: #320607;
            /* Warna gelap untuk sudut vignette */
            --card-tersier: #FFFFFF;

            /* Warna Aksen Glow */
            --color-accent-orange: #F8901D;

            /* Teks */
            --text-on-light: #2D3142;
            --text-muted: #8A92A6;
        }

        body {
            /* EFEK VIGNETTE: Pusat terang marun berpindah semakin gelap ke sudut layar */
            background: radial-gradient(circle at center, var(--bg-primary) 0%, var(--bg-dark-vignette) 100%);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Container Utama Auth */
        .auth-container {
            width: 100%;
            max-width: 420px;
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Komponen Card dengan Efek Ambient Glow */
        .auth-card {
            background-color: var(--card-tersier);
            border-radius: 20px;
            /* Sudut sedikit lebih lembut */
            padding: 44px 36px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            /* Border tipis agar kartu makin pop-out */

            /* EFEK GLOW: Kombinasi bayangan gelap (depth) + pendaran marun & oranye tipis */
            box-shadow:
                0 24px 48px rgba(0, 0, 0, 0.35),
                0 0 40px rgba(150, 25, 23, 0.25),
                0 0 80px rgba(248, 144, 29, 0.1);

            position: relative;
        }

        .auth-logo-title {
            font-size: 1.65rem;
            font-weight: 700;
            color: var(--bg-secondary);
            text-align: center;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .auth-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* Styling Form Input Modern */
        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-on-light);
            margin-bottom: 6px;
        }

        .form-control {
            border: 1.5px solid #E2E8F0;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 0.9rem;
            color: var(--text-on-light);
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--bg-secondary);
            box-shadow: 0 0 0 3px rgba(150, 25, 23, 0.15);
            outline: none;
        }

        /* Link & Checkbox */
        .form-check-label {
            font-size: 0.85rem;
            color: var(--text-on-light);
            font-weight: 500;
        }

        .form-check-input:checked {
            background-color: var(--bg-secondary);
            border-color: var(--bg-secondary);
        }

        .auth-link {
            font-size: 0.85rem;
            color: var(--bg-secondary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .auth-link:hover {
            color: var(--color-accent-orange);
        }

        /* Tombol Utama dengan Glow Saat Hover */
        .btn-auth-submit {
            background-color: var(--bg-secondary);
            color: var(--card-tersier);
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-weight: 600;
            font-size: 1rem;
            width: 100%;
            transition: all 0.25s ease;
            margin-top: 8px;
            box-shadow: 0 4px 12px rgba(150, 25, 23, 0.25);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-auth-submit:hover {
            background-color: #741415;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(116, 20, 21, 0.4);
        }

        .btn-auth-submit:active {
            transform: translateY(1px);
        }

        .btn-auth-submit:disabled {
            background-color: var(--text-muted);
            box-shadow: none;
            transform: none;
            cursor: not-allowed;
        }

        /* Animasi Masuk Halus */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
                filter: blur(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }
    </style>
</head>

<body>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo-title">Admin Dashboard</div>
            <div class="auth-subtitle">Silakan masuk untuk mengakses sistem informasi internal</div>

            <!-- Error message alert placeholder -->
            <div id="error-alert" class="alert alert-danger d-none" role="alert" style="border-radius: 10px; font-size: 0.85rem; margin-bottom: 20px;">
                ID Pengguna atau Kata Sandi salah.
            </div>

            <form id="login-form">
                <div class="mb-3" style="margin-bottom: 20px;">
                    <label for="login-username" class="form-label">ID Pengguna</label>
                    <input type="text" id="login-username" class="form-control" placeholder="Masukkan ID Pengguna" required>
                </div>

                <div class="mb-3" style="margin-bottom: 24px;">
                    <div class="d-flex justify-content-between align-items-center">
                        <label for="login-password" class="form-label mb-0">Kata Sandi</label>
                        <a href="#" class="auth-link" style="font-size: 0.8rem;">Lupa Sandi?</a>
                    </div>
                    <input type="password" id="login-password" class="form-control mt-1" placeholder="••••••••" required>
                </div>

                <div class="mb-4 form-check d-flex align-items-center">
                    <input type="checkbox" class="form-check-input" id="remember-me">
                    <label class="form-check-label ms-2" for="remember-me">Ingat saya di perangkat ini</label>
                </div>

                <button type="submit" id="login-btn" class="btn-auth-submit">
                    <span id="login-btn-text">Masuk Ke Dashboard</span>
                    <span id="login-btn-spinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                </button>
            </form>
        </div>
    </div>

    <!-- Auth Controller Logic -->
    <script type="module" src="js/auth.js"></script>
</body>

</html>
